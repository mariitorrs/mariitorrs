<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" role="img">
<title>Feito com carinho</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bob2{animation:bob 2.6s ease-in-out .9s infinite;transform-box:fill-box;transform-origin:center}
.twinkle{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

.bob{animation:bob 1.6s steps(2,end) infinite}
.bob2{animation:bob 1.6s steps(2,end) .8s infinite}
.beat{animation:beat 1.2s steps(2,end) infinite;transform-box:fill-box;transform-origin:center}
.sway{animation:sway 2.4s steps(3,end) infinite;transform-box:fill-box;transform-origin:50% 100%}
.sway2{animation:sway 2.4s steps(3,end) .6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.twinkle{animation:tw 1.8s steps(2,end) infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 3.6s linear infinite;opacity:0}
.cloud{animation:drift 38s linear infinite}
.petal{animation:fall 5s linear infinite;opacity:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes sway{0%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}100%{transform:rotate(-5deg)}}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes drift{from{transform:translateX(-240px)}to{transform:translateX(1140px)}}
@keyframes fall{0%{transform:translate(0,-10px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(30px,200px) rotate(200deg);opacity:0}}
</style>
<defs><pattern id="gh" width="22" height="22" patternUnits="userSpaceOnUse">
<rect width="22" height="22" fill="#F7E4D2"/>
<rect width="11" height="22" fill="#A32235" opacity=".28"/>
<rect width="22" height="11" fill="#A32235" opacity=".28"/>
<rect width="6" height="22" fill="#A32235" opacity=".12" x="14"/>
<rect width="22" height="6" fill="#A32235" opacity=".12" y="14"/>
</pattern></defs><rect x="0" y="0" width="1000" height="130" rx="0" fill="#FFF0DA"/><text x="500" y="72" text-anchor="middle" font-family="Georgia, DejaVu Serif, serif" font-size="36" fill="#A32235">feito com carinho</text><g transform="translate(441.0 79.0)"><g class="bob"><rect x="2" y="0" width="6" height="2" fill="#CA3042"/><rect x="14" y="0" width="6" height="2" fill="#CA3042"/><rect x="0" y="2" width="2" height="2" fill="#CA3042"/><rect x="2" y="2" width="4" height="2" fill="#EC726C"/><rect x="6" y="2" width="16" height="2" fill="#CA3042"/><rect x="0" y="4" width="2" height="2" fill="#CA3042"/><rect x="2" y="4" width="2" height="2" fill="#EC726C"/><rect x="4" y="4" width="18" height="2" fill="#CA3042"/><rect x="0" y="6" width="22" height="2" fill="#CA3042"/><rect x="2" y="8" width="18" height="2" fill="#CA3042"/><rect x="4" y="10" width="14" height="2" fill="#CA3042"/><rect x="6" y="12" width="10" height="2" fill="#CA3042"/><rect x="8" y="14" width="6" height="2" fill="#CA3042"/><rect x="10" y="16" width="2" height="2" fill="#CA3042"/></g></g><g transform="translate(507.0 79.0)"><g class="bob2"><rect x="2" y="0" width="6" height="2" fill="#626B34"/><rect x="14" y="0" width="6" height="2" fill="#626B34"/><rect x="0" y="2" width="2" height="2" fill="#626B34"/><rect x="2" y="2" width="4" height="2" fill="#EC726C"/><rect x="6" y="2" width="16" height="2" fill="#626B34"/><rect x="0" y="4" width="2" height="2" fill="#626B34"/><rect x="2" y="4" width="2" height="2" fill="#EC726C"/><rect x="4" y="4" width="18" height="2" fill="#626B34"/><rect x="0" y="6" width="22" height="2" fill="#626B34"/><rect x="2" y="8" width="18" height="2" fill="#626B34"/><rect x="4" y="10" width="14" height="2" fill="#626B34"/><rect x="6" y="12" width="10" height="2" fill="#626B34"/><rect x="8" y="14" width="6" height="2" fill="#626B34"/><rect x="10" y="16" width="2" height="2" fill="#626B34"/></g></g><rect x="0" y="104" width="1000" height="26" fill="url(#gh)"/>
</svg>
