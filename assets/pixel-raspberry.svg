<svg xmlns="http://www.w3.org/2000/svg" width="72" height="78" viewBox="0 0 72 78" role="img"><title>Framboesa animada</title><style>
.bob{animation:bob 1.6s steps(2,end) infinite}
.bob2{animation:bob 1.6s steps(2,end) .8s infinite}
.beat{animation:beat 1.2s steps(2,end) infinite;transform-box:fill-box;transform-origin:center}
.sway{animation:sway 2.4s steps(3,end) infinite;transform-box:fill-box;transform-origin:50% 100%}
.sway2{animation:sway 2.4s steps(3,end) .6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.twinkle{animation:tw 1.8s steps(2,end) infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 3.6s linear infinite;opacity:0}
.cloud{animation:drift 38s linear infinite}
.petal{animation:fall 5s linear infinite;opacity:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes sway{0%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}100%{transform:rotate(-5deg)}}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes drift{from{transform:translateX(-240px)}to{transform:translateX(1140px)}}
@keyframes fall{0%{transform:translate(0,-10px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(30px,200px) rotate(200deg);opacity:0}}
</style><g class="bob" shape-rendering="crispEdges"><rect x="24" y="0" width="6" height="6" fill="#626B34"/><rect x="30" y="0" width="6" height="6" fill="#8FA04E"/><rect x="36" y="0" width="12" height="6" fill="#626B34"/><rect x="24" y="6" width="24" height="6" fill="#626B34"/><rect x="18" y="12" width="36" height="6" fill="#7E1A2A"/><rect x="12" y="18" width="6" height="6" fill="#7E1A2A"/><rect x="18" y="18" width="6" height="6" fill="#A32235"/><rect x="24" y="18" width="6" height="6" fill="#EC726C"/><rect x="30" y="18" width="12" height="6" fill="#A32235"/><rect x="42" y="18" width="6" height="6" fill="#EC726C"/><rect x="48" y="18" width="6" height="6" fill="#A32235"/><rect x="54" y="18" width="6" height="6" fill="#7E1A2A"/><rect x="6" y="24" width="6" height="6" fill="#7E1A2A"/><rect x="12" y="24" width="48" height="6" fill="#A32235"/><rect x="60" y="24" width="6" height="6" fill="#7E1A2A"/><rect x="6" y="30" width="6" height="6" fill="#7E1A2A"/><rect x="12" y="30" width="48" height="6" fill="#A32235"/><rect x="60" y="30" width="6" height="6" fill="#7E1A2A"/><rect x="0" y="36" width="6" height="6" fill="#7E1A2A"/><rect x="6" y="36" width="6" height="6" fill="#EC726C"/><rect x="12" y="36" width="12" height="6" fill="#A32235"/><rect x="24" y="36" width="6" height="6" fill="#EC726C"/><rect x="30" y="36" width="12" height="6" fill="#A32235"/><rect x="42" y="36" width="6" height="6" fill="#EC726C"/><rect x="48" y="36" width="12" height="6" fill="#A32235"/><rect x="60" y="36" width="6" height="6" fill="#EC726C"/><rect x="66" y="36" width="6" height="6" fill="#7E1A2A"/><rect x="0" y="42" width="6" height="6" fill="#7E1A2A"/><rect x="6" y="42" width="60" height="6" fill="#A32235"/><rect x="66" y="42" width="6" height="6" fill="#7E1A2A"/><rect x="0" y="48" width="6" height="6" fill="#7E1A2A"/><rect x="6" y="48" width="60" height="6" fill="#A32235"/><rect x="66" y="48" width="6" height="6" fill="#7E1A2A"/><rect x="6" y="54" width="6" height="6" fill="#7E1A2A"/><rect x="12"