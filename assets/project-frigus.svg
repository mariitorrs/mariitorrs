<svg xmlns="http://www.w3.org/2000/svg" width="430" height="250" viewBox="0 0 430 250" role="img">
<title>Frigus</title>
<style>
.bob{animation:bob 1.6s steps(2,end) infinite}
.bob2{animation:bob 1.6s steps(2,end) .8s infinite}
.beat{animation:beat 1.2s steps(2,end) infinite;transform-box:fill-box;transform-origin:center}
.sway{animation:sway 2.4s steps(3,end) infinite;transform-box:fill-box;transform-origin:50% 100%}
.sway2{animation:sway 2.4s steps(3,end) .6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.twinkle{animation:tw 1.8s steps(2,end) infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 3.6s linear infinite;opacity:0}
.cloud{animation:drift 38s linear infinite}
.petal{animation:fall 5s linear infinite;opacity:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes sway{0%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}100%{transform:rotate(-5deg)}}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes drift{from{transform:translateX(-240px)}to{transform:translateX(1140px)}}
@keyframes fall{0%{transform:translate(0,-10px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(30px,200px) rotate(200deg);opacity:0}}
</style>
<rect x="2" y="2" width="426" height="246" rx="22" fill="#FFF0DA" stroke="#A32235" stroke-width="4"/><rect x="12" y="12" width="406" height="226" rx="14" fill="none" stroke="#A32235" stroke-width="1.5" stroke-dasharray="2 6" opacity=".6"/><path d="M2 24 Q2 2 24 2 L406 2 Q428 2 428 24 L428 66 L2 66 Z" fill="#A32235"/><text x="26" y="46" font-family="Georgia, DejaVu Serif, serif" font-size="24" fill="#FFF0DA">Frigus</text><g transform="translate(375.0 13.0)"><g class="twinkle"><rect x="2" y="0" width="6" height="2" fill="#D9A843"/><rect x="14" y="0" width="6" height="2" fill="#D9A843"/><rect x="0" y="2" width="2" height="2" fill="#D9A843"/><rect x="2" y="2" width="4" height="2" fill="#EC726C"/><rect x="6" y="2" width="16" height="2" fill="#D9A843"/><rect x="0" y="4" width="2" height="2" fill="#D9A843"/><rect x="2" y="4" width="2" height="2" fill="#EC726C"/><rect x="4" y="4" width="18" height="2" fill="#D9A843"/><rect x="0" y="6" width="22" height="2" fill="#D9A843"/><rect x="2" y="8" width="18" height="2" fill="#D9A843"/><rect x="4" y="10" width="14" height="2" fill="#D9A843"/><rect x="6" y="12" width="10" height="2" fill="#D9A843"/><rect x="8" y="14" width="6" height="2" fill="#D9A843"/><rect x="10" y="16" width="2" height="2" fill="#D9A843"/></g></g><text x="26" y="96" font-family="Verdana, DejaVu Sans, sans-serif" font-size="14" fill="#3D3026">Uma plataforma para organizar estoques de</text><text x="26" y="118" font-family="Verdana, DejaVu Sans, sans-serif" font-size="14" fill="#3D3026">alimentos, acompanhar validades e ajudar a</text><text x="26" y="140" font-family="Verdana, DejaVu Sans, sans-serif" font-size="14" fill="#3D3026">reduzir desperdícios. Eu cuido do design das</text><text x="26" y="162" font-family="Verdana, DejaVu Sans, sans-serif" font-size="14" fill="#3D3026">interfaces e da experiência do usuário.</text><text x="26" y="222" font-family="Verdana, DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#626B34">UX/UI · Figma · Design Thinking · Prototipação</text>
</svg>
