name: Generate pink contribution snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate pink snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mariitorrs
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23D88EAC&color_dots=%23FFF7FA,%23F8D9E7,%23F0BBD2,%23D88EAC,%239D5279

      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
