name: Generate raspberry contribution snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate raspberry snake SVG (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mariitorrs
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%2373783C&color_dots=%23FFF0DA,%23E6B2A0,%23D86A68,%23CA3042,%23A32235
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23B1BA6B&color_dots=%2323311E,%235A2830,%23942E3A,%23CA3042,%23F08F85

      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
